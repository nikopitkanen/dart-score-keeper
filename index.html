<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Score Keeper</title>
    <link rel="stylesheet" href="./styles/main.css">
    <script src="./src/main.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>Darts Score Keeper</h1>
    </header>

    <main>
      <section id="setup-section">
        <h2>Game Setup</h2>
        <form id="setup-form">
          <label>
            Player 1:
            <input id="player-1" type="text" required>
          </label>
          <label>
            Player 2:
            <input id="player-2" type="text" required>
          </label>
          <label>
            Game Type:
            <select id="game-type">
              <option value="301">301</option>
              <option value="501">501</option>
            </select>
          </label>
          <label>
            Legs to Win:
            <input id="set-size" type="number" min="1" value="3" required>
          </label>
          <button id="start-game" type="button">Start Game</button>
        </form>
      </section>

      <section id="game-section" hidden>
        <div id="scoreboard"></div>

<div id="turn-input">
  <h3>Enter Turn Score</h3>
  
  <label>
    Current Player: <span id="current-player-name"></span>
  </label>

  <input id="turn-score" type="text" placeholder="0" readonly>
  
  <div id="keypad">
    <button class="key" data-val="1">1</button>
    <button class="key" data-val="2">2</button>
    <button class="key" data-val="3">3</button>
    <button class="key" data-val="4">4</button>
    <button class="key" data-val="5">5</button>
    <button class="key" data-val="6">6</button>
    <button class="key" data-val="7">7</button>
    <button class="key" data-val="8">8</button>
    <button class="key" data-val="9">9</button>
    <button class="key action-btn" id="clear-btn">CLR</button>
    <button class="key" data-val="0">0</button>
    <button class="key action-btn" id="enter-btn">⏎</button>
  </div>

  <button id="undo-turn" style="margin-top: 15px;">Undo Last Turn</button>
</div>

        <div id="turn-history"></div>

        <button id="new-leg">Start New Leg</button>
        <button id="reset-game">Reset Game</button>
      </section>
    </main>

</html>
