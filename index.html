<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Score Keeper</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css" />
    <script src="./src/main.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>Darts Score Keeper</h1>
    </header>

    <main>
      <section id="setup-section" >
        <h2>Game Setup</h2>

        <form novalidate class="setup-form" id="setup-form">
            <label>
              Game Type:
            </label>
            <div class="radio" id="game-type">
                <input class="radio__input" type="radio" name="gameType" id="gameType1" value="101">
                <label class="radio__label" for="gameType1">101</label>
                <input class="radio__input" type="radio" name="gameType" id="gameType2" value="301">
                <label class="radio__label" for="gameType2">301</label>
                <input class="radio__input" type="radio" name="gameType" id="gameType3" value="501" checked>
                <label class="radio__label" for="gameType3">501</label>
                <input class="radio__input" type="radio" name="gameType" id="gameType4" value="701">
                <label class="radio__label" for="gameType4">701</label>
                <input class="radio__input" type="radio" name="gameType" id="gameType5" value="1001">
                <label class="radio__label" for="gameType5">1001</label>
            </div>
            <div class="player-wrapper" id="player-wrapper">
                <div class="player-input-group">
                    <input
                        id="player-id-1"
                        type="text"
                        name="player"
                        required pattern="\w+"
                        minlength="3"
                        maxlength="20"
                        title="Player name must have following"
                        placeholder="player 1 name">
                        <span class="error" aria-live="polite"></span>
                </div>
                <div class="player-input-group">
                    <input
                        id="player-id-2"
                        type="text"
                        name="player"
                        required pattern="\w+"
                        minlength="3"
                        maxlength="20"
                        title="Player name must have following"
                        placeholder="player 2 name">
                        <span class="error" aria-live="polite"></span>
                </div>

            </div>


            <button id="add-player"><span class="iconoir-plus"></span></button>


          <label>
            Legs to Win:
            <input
                id="set-size"
                type="number"
                min="1"
                max="12"
                value="3"
                required>
          </label>
          <button class="normal" id="start-game" type="submit">Start Game</button>
        </form>

      </section>

      <section id="game-section" >
        <div id="scoreboard"></div>

        <div id="turn-input">
          <h3>Enter Turn Score</h3>
          <label>
            Current Player:
            <span id="current-player-name"></span>
          </label>
          <div>
              <button id="undo-turn" title="Undo your turn" aria-label="Undo your turn"><i class="iconoir-undo" aria-hidden="true"></i></button>
              <input id="turn-score" type="number" min="0" max="180">
              <button id="submit-turn" title="Submit your turn" aria-label="Submit your turn"><i class="iconoir-plus-circle" aria-hidden="true"></i></button>
          </div>

        </div>

        <div id="turn-history"></div>
            <div>
                <button id="new-leg">Start New Leg</button>
                <button id="reset-game">Reset Game</button>
            </div>

      </section>
    </main>
  </body>
</html>
